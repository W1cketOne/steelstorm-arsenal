plugins {
    id 'fabric-loom' version '1.13.6'
}

version = project.mod_version
group = 'com.steelstorm'
base { archivesName = 'steelstorm-arsenal-fabric-1.21.1' }

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
}

loom {
    accessWidenerPath = file('src/main/resources/steelstorm.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

loom {
    runs {
        client {
            runDir 'run'
            // ./gradlew runClient -PquickPlayServer=localhost joins a server straight away.
            if (project.findProperty('quickPlayServer')) {
                programArgs '--quickPlayMultiplayer', project.findProperty('quickPlayServer').toString()
            }
        }
        server {
            runDir 'run-server'
        }
    }
}
